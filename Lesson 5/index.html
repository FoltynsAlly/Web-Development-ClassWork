<body>
    <div class="story-card">
        <h1>The Helpful Rabbit</h1>
        <img src="https://tse3.mm.bing.net/th/id/OIP.YIskP5Il3Rs5HdVC5uKcIQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="The Helpful Rabbit">
        
        <h2>A Story about kindness.</h2>
        <p>One day, a little turtle was trying to cross
        a muddy path.He was tired and couldn't move quickly.
        </p>
        <p>A kind rabbit saw the turtle and helped him cross
        the path.The turtle thanked the turtle with a big smile.
        </p>
        <div class="moral">
        <b>Moral:</b>Always help someone in need.
    </div>
    </div>
